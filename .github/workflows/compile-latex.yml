name: Compile LaTeX PDF

on:
  push:
    branches:
      - '**'

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile LaTeX document
        uses: xu-cheng/latex-action@v3
        with:
          root_file: IEEE-conference-template-062824.tex
          working_directory: articulo_latex
          latexmk_use_xelatex: false

      - name: Commit compiled PDF
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add articulo_latex/IEEE-conference-template-062824.pdf
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "ci: compile PDF from LaTeX source [skip ci]"
            git push
          fi
